[package]
name = "satysfi-formatter"
version = "0.1.0"
edition = "2021"
authors = ["usagrada"]
license = "MIT"
repository = "https://github.com/usagrada/"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
satysfi-parser = { git = "https://github.com/usagrada/satysfi-parser.git", rev = "9a064ad23eeb41edf9262ae0ea60a39b6f4fcb39" }
clap = { version = "3", features = ["derive"] }
dirs = "*"
lspower = { version = "1.4.0", optional = true }
pretty = "0.12"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[features]
default = ["lsp"]
# language server 向けの API (`format` / `formatting`)。LSP の型 (lspower) を使う
lsp = ["dep:lspower"]

[[bin]]
name = "satysfi-fmt"
path = "src/main.rs"
