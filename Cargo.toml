[package]
name = "satysfi-formatter"
version = "0.1.0"
edition = "2021"
authors = ["usagrada"]
license = "MIT"
repository = "https://github.com/usagrada/"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
satysfi-parser = { git = "https://github.com/usagrada/satysfi-parser.git", rev = "4adc7e74b1ed2382e85b2eee62717a5fd9d5e565" }
clap = { version = "3", features = ["derive"] }
dirs = "*"
lspower = "1.4.0"
pretty = "0.12"

[[bin]]
name = "satysfi-fmt"
path = "src/main.rs"
